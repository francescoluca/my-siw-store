<!DOCTYPE html>

<head>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
	<link rel="stylesheet" href="/css/styles.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <meta charset="UTF-8">
    <!-- Questi link saranno nelle pagine che includono l'header -->
</head>

<body>
    <!-- Header Fragment -->
    <nav th:fragment="siteHeader" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="fas fa-tv me-2"></i>TV Recycle Store
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}" th:classappend="${activePage=='home'} ? ' active'">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/formPickUpRequest}" th:classappend="${activePage=='servizio-ritiro'} ? ' active'">Servizio di ritiro</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/about}" th:classappend="${activePage=='about'} ? ' active'">Chi siamo</a>
                    </li>
                    <li class="nav-item" th:if="${userDetails}">
                        <a class="nav-link" th:href="@{/profile}" th:classappend="${activePage=='profile'} ? ' active'">Profilo</a>
                    </li>
                </ul>
                <div class="d-flex ms-3">
                    <!-- Gestione Login/Logout -->
                    <div th:if="${userDetails}">
                        <button class="btn btn-outline-primary me-2" th:onclick="'window.location.href=\'/logout\''">
                            <i class="fas fa-user"></i> Logout
                        </button>
                    </div>
                    
                    <div th:unless="${userDetails}">
                        <button class="btn btn-outline-primary me-2" th:onclick="'window.location.href=\'/login\''">
                            <i class="fas fa-user"></i> Login
                        </button>
                    </div>
                    
                    <button class="btn btn-primary" th:onclick="'window.location.href=\'/cart\''">
                        <i class="fas fa-shopping-cart"></i> Carrello
                    </button>
                </div>
            </div>
        </div>
    </nav>
</body>

</html>

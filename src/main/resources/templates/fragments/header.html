<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">


	<head>
		<title>Homepage</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
			integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
			 <meta charset="UTF-8">
			  <!-- Tuo CSS -->
			  <link rel="stylesheet" href="/css/styles.css">
			</head>

	<body>
		<!-- Header globale (frammento Thymeleaf) -->
		<header
		  th:fragment="siteHeader"
		  class="navbar d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
		  
		  <div class="container nav-content row">

		    <!-- Logo -->
		    <a th:href="@{/}"
		       class="logo d-inline-flex align-items-center text-decoration-none"
		       th:classappend="${activePage=='home'} ? ' active'">
		      <div class="logo-icon">
		        <!-- SVG o immagine qui -->
		      </div>
		      <span class="logo-text">SIW Televisori</span>
		    </a>

		    <!-- Menu principale -->
		    <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
		      <li>
		        <a th:href="@{/}"
		           class="nav-link px-2"
		           th:classappend="${activePage=='home'} ? ' active'">
		          HOME
		        </a>
		      </li>
		      <li>
		        <a th:href="@{/formPickUpRequest}"
		           class="nav-link px-2"
		           th:classappend="${activePage=='servizio-ritiro'} ? ' active'">
		          SERVIZIO RITIRO
		        </a>
		      </li>
		      <li>
		        <a th:href="@{/about}"
		           class="nav-link px-2"
		           th:classappend="${activePage=='about'} ? ' active'">
		          CHI SIAMO
		        </a>
		  <!--    </li>
		      <li th:if="${isAdmin}">
		        <a th:href="@{/admin}"
		           class="nav-link px-2"
		           th:classappend="${activePage=='admin'} ? ' active'">
		          MODALITÀ ADMIN
		        </a>
		      </li>
		      <li th:unless="${isAdmin}">
		        <a th:href="@{/admin/userModeAdmin}"
		           class="nav-link px-2"
		           th:classappend="${activePage=='userMode'} ? ' active'">
		          MODALITÀ USER
		        </a>
		      </li> -->
			  <li>
			     <a th:href="${isAdmin} 
			                  ? @{/admin} 
			                  : @{/admin/userModeAdmin}"
			        class="nav-link px-2"
			        th:classappend="${activePage=='admin'} ? ' active'">
			       <span th:text="${isAdmin} 
			                       ? 'MODALITÀ ADMIN' 
			                       : 'MODALITÀ USER'">
			         MODALITÀ
			       </span>
			     </a>
			   </li>
		    </ul>

		    <!-- Area utente / carrello -->
		    <div class="col-md-3 text-end">
		      <div th:if="${userDetails}">
		        <a th:href="@{/profile}"
		           class="nav-link px-2 me-2"
		           th:classappend="${activePage=='profile'} ? ' active'">
		        </a>
		        <a th:href="@{/cart}"
		           class="nav-link px-2 me-2"
		           th:classappend="${activePage=='cart'} ? ' active'">
		          <!-- SVG carrello qui -->
		        </a>
		        <a th:href="@{/logout}" class="btn btn-primary">Logout</a>
		      </div>
		      <div th:unless="${userDetails}">
		        <a th:href="@{/login}"
		           class="btn btn-outline-primary me-2"
		           th:classappend="${activePage=='login'} ? ' active'">
		          Accedi
		        </a>
		        <a th:href="@{/register}"
		           class="btn btn-primary"
		           th:classappend="${activePage=='register'} ? ' active'">
		          Registrati
		        </a>
		      </div>
		    </div>

		  </div>
		</header>

			
	</body>

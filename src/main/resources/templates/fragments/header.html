<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">


	<head>
		<title>Homepage</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
			integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
			 <meta charset="UTF-8">
			  <!-- Tuo CSS -->
			  <link rel="stylesheet" href="/css/styles.css">
			</head>

	<body>
		<!-- Header globale (frammento Thymeleaf) -->
		<!-- fragments/header.html -->
		<header th:fragment="siteHeader" class="navbar">
		  <div class="container d-flex justify-content-between align-items-center">

		    <!-- Logo + menu -->
		    <div class="d-flex align-items-center gap-4">
		      <a href="/" class="logo d-flex align-items-center">
		        <div class="logo-icon">
		          <div class="logo-shape"></div>
		        </div>
		        <span class="logo-text">SIW Televisori</span>
		      </a>

			  <nav class="main-nav d-flex justify-content-center flex-grow-1 gap-4">
			    <a th:href="@{/}" th:classappend="${activePage=='home'} ? ' link-active'">Home</a>
			    <a th:href="@{/formPickUpRequest}" th:classappend="${activePage=='servizio-ritiro'} ? ' link-active'">Servizio ritiro</a>
			    <a th:href="@{/about}" th:classappend="${activePage=='about'} ? ' link-active'">Chi siamo</a>
				<a th:href="@{/cart}" class="nav-link active" th:classappend="${activePage=='cart'} ? ' active'">
				  <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="none" stroke="black" stroke-width="1.5"
				       stroke-linecap="round" stroke-linejoin="round" class="bi bi-cart" viewBox="0 0 24 24">
				    <circle cx="9" cy="21" r="1"/>
				    <circle cx="20" cy="21" r="1"/>
				    <path d="M1 1h4l2.68 13.39a1 1 0 0 0 .99.81H19a1 1 0 0 0 .97-.76L23 6H6"/>
				  </svg>
				</a>

			  </nav>
		    </div>

		    <!-- Carrello + utente -->
		    <div class="d-flex align-items-center gap-3">

		      <!-- Carrello -->

		      <!-- Area utente -->
		      <div class="user-area d-flex align-items-center gap-2">
		        <div th:if="${userDetails}" class="d-flex align-items-center gap-2">
					<a th:href="@{/profile}"
					   class="nav-profile"
					   th:classappend="${activePage=='profile'} ? ' nav-profile-active'">
					  <span th:text="'Ciao ' + ${userDetails.username}"></span>
					</a>
		          <a th:href="@{/logout}" class="btn btn-outline">Logout</a>
		        </div>
		        <div th:unless="${userDetails}" class="d-flex align-items-center gap-2">
		          <a th:href="@{/login}" class="btn-outline" th:classappend="${activePage=='login'} ? ' active'">Accedi</a>
		          <a th:href="@{/register}" class="btn btn-primary" th:classappend="${activePage=='register'} ? ' active'">Registrati</a>
		        </div>
		      </div>
		    </div>
		  </div>
		</header>


			
	</body>

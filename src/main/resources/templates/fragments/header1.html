<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">


	<head>
		<title>Homepage</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
			integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
			 <meta charset="UTF-8">
			  <!-- Tuo CSS -->
			  <link rel="stylesheet" href="/css/styles.css">
			</head>

	<body>
<!-- Header -->
   <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
       <div class="container">
           <a class="navbar-brand" href="@{/}">
               <i class="fas fa-tv me-2"></i>TV Recycle Store
           </a>
           
           <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
               <span class="navbar-toggler-icon"></span>
           </button>
           
           <div class="collapse navbar-collapse" id="navbarNav">
               <ul class="navbar-nav ms-auto">
                   <li class="nav-item">
                       <a class="nav-link" th:href="@{/}">Home</a>
                   </li>
                   <li class="nav-item">
                       <a class="nav-link" th:href="@{/formPickUpRequest}">Servizio di ritiro</a>
                   </li>
                   <li class="nav-item">
                       <a class="nav-link" href="@{/about}">Chi siamo</a>
                   </li>
				   <li class="nav-item">
				       <a class="nav-link" th:href="@{/profile}">Profilo</a>
				   </li>
               </ul>
               <div class="d-flex ms-3">
				<button class="btn btn-outline-primary me-2" 
				        th:text="${userDetails} ? '|&#xf007; Logout|' : '|&#xf007; Login|'"
				        th:onclick="${userDetails} ? 'window.location.href=\'/logout\'' : 'window.location.href=\'/login\''">
				    <i class="fas fa-user"></i> Login
				</button>
                   <button class="btn btn-primary" onclick="window.location.href='@{/cart}'">
                       <i class="fas fa-shopping-cart"></i> Carrello
                   </button>
               </div>
           </div>
       </div>
   </nav>
   </body>

<!DOCTYPE html>
<html>

	<head>
		<title>TV</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
			integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
			<link rel="stylesheet" href="/css/styles.css">
			<meta charset="UTF-8">
	</head>

	<body>
		<div class="container">
			<div th:replace="fragments/header :: siteHeader"></div>
		</div>
		<h1>Dettagli Televisore</h1>
		<div th:if="${television}">
			<div class="ratio" style="--bs-aspect-ratio: 150%; max-width: 200px;">
				<div th:if="${television.photo}"><img th:src="@{'/television/' + ${television.id} + '/photo'}"
						class="w-110 h-68 object-fit-contain" alt="Foto televisore" />
				</div>
				<div th:unless="${television.photo}"><img src="/images/noTelevisionPhoto.jpg"
						class="w-110 h-68 object-fit-contain" alt="Foto televisore"/>
				</div>
			</div>
			<div th:text="'Modello: ' + ${television.model}"></div>
			<div th:text="'Brand: ' + ${television.brand}"></div>
			<div th:text="'Anno: ' + ${television.releaseDate}"></div>
			<div th:text="'Pollici: ' + ${television.screenInches}"></div>
			<div th:if="${television.description}">
				<div th:text="'Descrizione: ' + ${television.description}"></div>
			</div>
			<div th:unless="${television.description}">nessuna descrizione</div>
		</div>
		<div th:unless="${television}">Non esiste</div>
	</body>
</html>

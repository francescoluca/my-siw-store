<!DOCTYPE html>
<html lang="it">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Carrello - SIW Televisori Roma</title>
		<meta name="description"
			content="Carrello acquisti SIW Televisori - Finalizza il tuo acquisto di televisori usati selezionati.">

		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			:root {
				--primary-color: #1e3a8a;
				--primary-hover: #1e40af;
				--accent-color: #f59e0b;
				--background: #ffffff;
				--foreground: #1f2937;
				--muted: #6b7280;
				--border: #e5e7eb;
				--card-bg: #ffffff;
				--shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
				--shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
				--success: #10b981;
				--danger: #ef4444;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
				line-height: 1.6;
				color: var(--foreground);
				background-color: var(--background);
				min-height: 100vh;
			}

			.container {
				max-width: 1200px;
				margin: 0 auto;
				padding: 0 1rem;
			}

			/* Navigation */
			.navbar {
				border-bottom: 1px solid var(--border);
				background: rgba(255, 255, 255, 0.8);
				backdrop-filter: blur(10px);
				position: sticky;
				top: 0;
				z-index: 10;
			}

			.nav-container {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 1rem 0;
			}

			.logo {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				text-decoration: none;
			}

			.logo-icon {
				background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
				padding: 0.5rem;
				border-radius: 0.5rem;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.logo-shape {
				width: 1.5rem;
				height: 1.5rem;
				background: white;
				border-radius: 0.25rem;
			}

			.logo-text {
				font-size: 1.25rem;
				font-weight: bold;
				color: var(--foreground);
			}

			.nav-menu {
				display: flex;
				align-items: center;
				gap: 2rem;
			}

			.nav-link {
				text-decoration: none;
				color: var(--muted);
				font-weight: 500;
				transition: color 0.3s ease;
			}

			.nav-link:hover {
				color: var(--foreground);
			}

			.nav-link.active {
				color: var(--primary-color);
				font-weight: 600;
			}

			.btn {
				padding: 0.5rem 1rem;
				border: none;
				border-radius: 0.375rem;
				font-weight: 500;
				text-decoration: none;
				display: inline-block;
				transition: all 0.3s ease;
				cursor: pointer;
			}

			.btn-primary {
				background: var(--primary-color);
				color: white;
			}

			.btn-primary:hover {
				background: var(--primary-hover);
			}

			.btn-outline {
				border: 1px solid var(--border);
				background: transparent;
				color: var(--foreground);
			}

			.btn-outline:hover {
				background: var(--border);
			}

			.btn-danger {
				background: var(--danger);
				color: white;
			}

			.btn-danger:hover {
				background: #dc2626;
			}

			/* Main Content */
			.main-content {
				padding: 2rem 0;
				min-height: calc(100vh - 200px);
			}

			.page-header {
				text-align: center;
				margin-bottom: 3rem;
			}

			.page-title {
				font-size: 2.5rem;
				font-weight: bold;
				color: var(--foreground);
				margin-bottom: 1rem;
			}

			.page-subtitle {
				font-size: 1.125rem;
				color: var(--muted);
				max-width: 600px;
				margin: 0 auto;
			}

			/* Cart Content */
			.cart-container {
				display: grid;
				grid-template-columns: 1fr 400px;
				gap: 2rem;
				align-items: start;
			}

			@media (max-width: 768px) {
				.cart-container {
					grid-template-columns: 1fr;
				}
			}

			.cart-items {
				background: var(--card-bg);
				border-radius: 0.5rem;
				box-shadow: var(--shadow);
				overflow: hidden;
			}

			.cart-item {
				display: flex;
				gap: 1rem;
				padding: 1.5rem;
				border-bottom: 1px solid var(--border);
				align-items: center;
			}

			.cart-item:last-child {
				border-bottom: none;
			}

			.item-image {
				width: 80px;
				height: 80px;
				background: #f3f4f6;
				border-radius: 0.5rem;
				flex-shrink: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				color: var(--muted);
				font-size: 0.875rem;
				overflow: hidden;
			}

			.item-image img {
				width: 100%;
				height: 100%;
				object-fit: cover;
				border-radius: 0.5rem;
			}


			.item-details {
				flex: 1;
			}

			.item-name {
				font-weight: 600;
				margin-bottom: 0.25rem;
				color: var(--foreground);
			}

			.item-description {
				color: var(--muted);
				font-size: 0.875rem;
				margin-bottom: 0.5rem;
			}

			.item-condition {
				display: inline-block;
				background: var(--success);
				color: white;
				padding: 0.25rem 0.5rem;
				border-radius: 0.25rem;
				font-size: 0.75rem;
				font-weight: 500;
			}

			.item-actions {
				display: flex;
				flex-direction: column;
				align-items: flex-end;
				gap: 0.5rem;
			}

			.item-price {
				font-size: 1.25rem;
				font-weight: bold;
				color: var(--primary-color);
			}

			.quantity-controls {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				background: var(--border);
				border-radius: 0.375rem;
				overflow: hidden;
			}

			.quantity-btn {
				border: none;
				background: transparent;
				padding: 0.25rem 0.5rem;
				cursor: pointer;
				color: var(--foreground);
			}

			.quantity-btn:hover {
				background: rgba(0, 0, 0, 0.1);
			}

			.quantity-display {
				padding: 0.25rem 0.75rem;
				background: white;
				min-width: 40px;
				text-align: center;
			}

			.remove-btn {
				background: none;
				border: none;
				color: var(--danger);
				cursor: pointer;
				padding: 0.25rem;
				border-radius: 0.25rem;
				transition: background 0.3s ease;
			}

			.remove-btn:hover {
				background: rgba(239, 68, 68, 0.1);
			}

			/* Cart Summary */
			.cart-summary {
				background: var(--card-bg);
				border-radius: 0.5rem;
				box-shadow: var(--shadow);
				padding: 1.5rem;
				position: sticky;
				top: 100px;
			}

			.summary-title {
				font-size: 1.25rem;
				font-weight: bold;
				margin-bottom: 1rem;
				color: var(--foreground);
			}

			.summary-row {
				display: flex;
				justify-content: space-between;
				margin-bottom: 0.75rem;
				color: var(--muted);
			}

			.summary-row.total {
				border-top: 1px solid var(--border);
				padding-top: 0.75rem;
				font-weight: bold;
				color: var(--foreground);
				font-size: 1.125rem;
			}

			.checkout-section {
				margin-top: 1.5rem;
				padding-top: 1.5rem;
				border-top: 1px solid var(--border);
			}

			.checkout-btn {
				width: 100%;
				padding: 0.75rem;
				font-size: 1rem;
				margin-bottom: 0.75rem;
			}

			.continue-shopping {
				width: 100%;
				text-align: center;
				color: var(--primary-color);
				text-decoration: none;
				font-weight: 500;
			}

			.continue-shopping:hover {
				text-decoration: underline;
			}

			.empty-cart {
				text-align: center;
				padding: 3rem;
				color: var(--muted);
			}

			.empty-cart-icon {
				font-size: 4rem;
				margin-bottom: 1rem;
			}

			/* Responsive Design */
			@media (max-width: 768px) {
				.nav-menu {
					gap: 1rem;
				}

				.page-title {
					font-size: 2rem;
				}

				.cart-item {
					flex-direction: column;
					text-align: center;
				}

				.item-actions {
					align-items: center;
					flex-direction: row;
					justify-content: space-between;
					width: 100%;
				}
			}
		</style>
	</head>

	<body>
	
		<main class="main-content">
			<div th:if="${cartItems.size}" class="container">
				<div class="page-header">
					<h1 class="page-title">Il Tuo Carrello</h1>
					<p class="page-subtitle">Rivedi i tuoi articoli e procedi con l'acquisto</p>
				</div>

				<div class="cart-container">
					<div class="cart-items">
						<ul class="list-unstyled">
							<li class="cart-item" th:each="cartItem : ${cartItems}">
								<div class="item-image" th:if="${cartItem.photo}">
									<img th:src="@{'/inventoryItem/' + ${inventoryItem.id} + '/photo'}"
										alt="Foto televisore" />

								</div>
								<div class="item-image" th:unless="${cartItem.photo}"><img
										src="/images/noTelevisionPhoto.jpg" alt="Foto televisore" />
								</div>
								<div class="item-details">
									<h3 class="item-name"
										th:text="${cartItem.television.model}+ ' '+ ${cartItem.television.screenInches} + '&quot;'">
									</h3>
									<p class="item-description" th:text="${cartItem.productCode}">
									</p>
									<span class="item-condition" th:text="${cartItem.condition}">Condizioni</span>
								</div>
								<div class="item-actions">
									<div class="item-price" th:text="${cartItem.price}+ ' euro'">Prezzo</div>
									<a th:href="@{'/removeFromCart/'+ ${cartItem.id}}"><button class="remove-btn"
											title="Rimuovi dal carrello">
											Rimuovi
										</button></a>
								</div>
							</li>
						</ul>
					</div>

					<div class="cart-summary">
						<h2 class="summary-title">Riepilogo Ordine</h2>

						<div class="summary-row">
							<span th:text="'Subtotale '+ '(' + ${cartItems.size} +' articoli)'">Subtotale (3
								articoli)</span>
							<span th:text="${subTotal}" id="subTotal"></span>
						</div>

						<div class="summary-row">
							<span>Spedizione</span>
							<span>Gratuita</span>
						</div>

						<div class="summary-row total">
							<span>Totale</span>
							<span id="subTotal" th:text="${subTotal}"></span>
						</div>

						<div class="checkout-section">
							<button class="btn btn-primary checkout-btn" onclick="proceedToCheckout()">
								Procedi al Checkout
							</button>
							<a href="/" class="continue-shopping">Continua gli Acquisti</a>
						</div>
					</div>
				</div>
			</div>
			<div th:unless="${cartItems.size}" class="container">
				<div class="empty-cart">
					<div class="empty-cart-icon">&#x1F6D2;</div>
					<h2>Il tuo carrello &egrave; vuoto</h2>
					<p>Inizia a fare shopping per aggiungere articoli al carrello</p>
					<a href="/" class="btn btn-primary" style="margin-top: 1rem;">Vai al Negozio</a>
				</div>
			</div>
		</main>
	</body>

</html>

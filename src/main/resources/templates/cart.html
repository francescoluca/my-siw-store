<!DOCTYPE html>
<html lang="it">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Carrello - SIW TV</title>
		<meta name="description"
			content="Carrello acquisti SIW Televisori - Finalizza il tuo acquisto di televisori usati selezionati.">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
			integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
		<link rel="stylesheet" href="/css/styles.css">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
		<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">


		<style>
			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
				line-height: 1.6;
				color: var(--foreground);
				background-color: var(--background);
				min-height: 100vh;
			}

			/* Main Content */
			.main-content {
				padding: 2rem 0;
				min-height: calc(100vh - 200px);
			}

			.page-header {
				text-align: center;
				margin-bottom: 3rem;
			}

			.page-title {
				font-size: 2.5rem;
				font-weight: bold;
				color: var(--foreground);
				margin-bottom: 1rem;
			}

			.page-subtitle {
				font-size: 1.125rem;
				color: var(--muted);
				max-width: 600px;
				margin: 0 auto;
			}

			/* Cart Content */
			.cart-container {
				display: grid;
				grid-template-columns: 1fr 400px;
				gap: 2rem;
				align-items: start;
			}

			@media (max-width: 768px) {
				.cart-container {
					grid-template-columns: 1fr;
				}
			}

			.cart-items {
				background: var(--card-bg);
				border-radius: 0.5rem;
				box-shadow: var(--shadow);
				overflow: hidden;
			}

			.cart-item {
				display: flex;
				gap: 1rem;
				padding: 1.5rem;
				border-bottom: 1px solid var(--border);
				align-items: center;
			}

			.cart-item:last-child {
				border-bottom: none;
			}

			.item-image {
				width: 80px;
				height: 80px;
				background: #f3f4f6;
				border-radius: 0.5rem;
				flex-shrink: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				color: var(--muted);
				font-size: 0.875rem;
				overflow: hidden;
			}

			.item-image img {
				width: 100%;
				height: 100%;
				object-fit: cover;
				border-radius: 0.5rem;
			}


			.item-details {
				flex: 1;
			}

			.item-name {
				font-weight: 600;
				margin-bottom: 0.25rem;
				color: var(--foreground);
			}

			.item-description {
				color: var(--muted);
				font-size: 0.875rem;
				margin-bottom: 0.5rem;
			}

			.item-condition {
				display: inline-block;
				background: var(--success);
				color: white;
				padding: 0.25rem 0.5rem;
				border-radius: 0.25rem;
				font-size: 0.75rem;
				font-weight: 500;
			}

			.item-actions {
				display: flex;
				flex-direction: column;
				align-items: flex-end;
				gap: 0.5rem;
			}

			.item-price {
				font-size: 1.25rem;
				font-weight: bold;
				color: var(--primary-color);
			}

			.quantity-controls {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				background: var(--border);
				border-radius: 0.375rem;
				overflow: hidden;
			}

			.quantity-btn {
				border: none;
				background: transparent;
				padding: 0.25rem 0.5rem;
				cursor: pointer;
				color: var(--foreground);
			}

			.quantity-btn:hover {
				background: rgba(0, 0, 0, 0.1);
			}

			.quantity-display {
				padding: 0.25rem 0.75rem;
				background: white;
				min-width: 40px;
				text-align: center;
			}

			.remove-btn {
				background: none;
				border: none;
				color: var(--danger);
				cursor: pointer;
				padding: 0.25rem;
				border-radius: 0.25rem;
				transition: background 0.3s ease;
			}

			.remove-btn:hover {
				background: rgba(239, 68, 68, 0.1);
			}

			/* Cart Summary */
			.cart-summary {
				background: var(--card-bg);
				border-radius: 0.5rem;
				box-shadow: var(--shadow);
				padding: 1.5rem;
				position: sticky;
				top: 100px;
			}

			.summary-title {
				font-size: 1.25rem;
				font-weight: bold;
				margin-bottom: 1rem;
				color: var(--foreground);
			}

			.summary-row {
				display: flex;
				justify-content: space-between;
				margin-bottom: 0.75rem;
				color: var(--muted);
			}

			.summary-row.total {
				border-top: 1px solid var(--border);
				padding-top: 0.75rem;
				font-weight: bold;
				color: var(--foreground);
				font-size: 1.125rem;
			}

			.checkout-section {
				margin-top: 1.5rem;
				padding-top: 1.5rem;
				border-top: 1px solid var(--border);
			}

			.checkout-btn {
				width: 100%;
				padding: 0.75rem;
				font-size: 1rem;
				margin-bottom: 0.75rem;
			}

			.continue-shopping {
				width: 100%;
				text-align: center;
				color: var(--primary-color);
				text-decoration: none;
				font-weight: 500;
			}

			.continue-shopping:hover {
				text-decoration: underline;
			}

			.empty-cart {
				text-align: center;
				padding: 3rem;
				color: var(--muted);
			}

			.empty-cart-icon {
				font-size: 4rem;
				margin-bottom: 1rem;
			}

			.tv-image-wrapper {
				aspect-ratio: 16 / 9;
				width: 160px;
				/* o un'altra dimensione coerente con il layout */
				background-color: #f3f4f6;
				border-radius: 0.5rem;
				overflow: hidden;
				flex-shrink: 0;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.tv-image-wrapper img {
				width: 100%;
				height: 100%;
				object-fit: contain;
				border-radius: 0.5rem;
				background-color: #fff;
			}
		</style>
	</head>

	<body>
		<div class="container-fluid px-0" th:replace="fragments/header :: siteHeader">
		</div>
		<main class="main-content">
			<div th:if="${cartItems.size}" class="container">
				<div class="page-header">
					<h1 class="page-title">Il Tuo Carrello</h1>
					<p class="page-subtitle">Rivedi i tuoi articoli e procedi con l'acquisto</p>
				</div>

				<div class="cart-container">
					<div class="cart-items">
						<ul class="list-unstyled">
							<li class="cart-item" th:each="cartItem : ${cartItems}">
								<div class="tv-image-wrapper">
									<img th:unless="${cartItem.photo}" src="/images/noTelevisionPhoto.jpg"
										alt="Foto televisore" class="card-img-top">
									<img th:if="${cartItem.photo}"
										th:src="@{'/inventoryItem/' + ${cartItem.id} + '/photo'}" alt="Foto televisore"
										class="card-img-top">

								</div>
								<div class="item-details">
									<h3 class="item-name"
										th:text="${cartItem.television.model}+ ' '+ ${cartItem.television.screenInches} + '&quot;'">
									</h3>
									<p class="item-description" th:text="${cartItem.productCode}">
									</p>
									<span class="item-condition" th:text="${cartItem.condition}">Condizioni</span>
								</div>
								<div class="item-actions">
									<div class="item-price" th:text="${cartItem.price}+ ' euro'">Prezzo</div>
									<a th:href="@{'/removeFromCart/'+ ${cartItem.id}}"><button class="remove-btn"
											title="Rimuovi dal carrello">
											Rimuovi
										</button></a>
								</div>
							</li>
						</ul>
					</div>

					<div class="cart-summary">
						<h2 class="summary-title">Riepilogo Ordine</h2>

						<div class="summary-row">
							<span th:text="'Subtotale '+ '(' + ${cartItems.size} +' articoli)'">Subtotale (3
								articoli)</span>
							<span th:text="${subTotal}" id="subTotal"></span>
						</div>

						<div class="summary-row">
							<span>Spedizione</span>
							<span>Gratuita</span>
						</div>

						<div class="summary-row total">
							<span>Totale</span>
							<span id="subTotal" th:text="${subTotal}"></span>
						</div>

						<div class="checkout-section">
							<button class="btn btn-primary checkout-btn" onclick="proceedToCheckout()">
								Procedi al Checkout
							</button>
							<a href="/" class="continue-shopping">Continua gli Acquisti</a>
						</div>
					</div>
				</div>
			</div>
			<div th:unless="${cartItems.size}" class="container">
				<div class="empty-cart">
					<div class="empty-cart-icon">&#x1F6D2;</div>
					<h2>Il tuo carrello &egrave; vuoto</h2>
					<p>Inizia a fare shopping per aggiungere articoli al carrello</p>
					<a href="/" class="btn btn-primary" style="margin-top: 1rem;">Vai al Negozio</a>
				</div>
			</div>
		</main>
		<footer th:replace="~{fragments/footer :: siteFooter}"></footer>

	</body>

</html>

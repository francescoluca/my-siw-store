<!DOCTYPE html>
<html>

	<head>
		<title>Televisore</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
			integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
		<link rel="stylesheet" href="/css/styles.css">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
		<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
		<meta charset="UTF-8">
	</head>

	<body>
		<div class="container-fluid px-0" th:replace="fragments/header :: siteHeader">
		</div>
		<h1>Dettagli Televisore</h1>
		<div th:if="${inventoryItem}">
			<div th:text="'Codice prodotto: ' + ${inventoryItem.productCode}"></div>
			<div th:text="'Prezzo: ' + ${inventoryItem.price} + ' euro'"></div>
			<div th:text="'Condizione: ' + ${inventoryItem.condition}"></div>
			<div th:text="'Optional: ' + ${inventoryItem.optional}"></div>
			<div th:text="'Descrizione: ' + ${inventoryItem.description}"></div>
			<div th:text="'Modello: ' + ${inventoryItem.television.model}"></div>
		</div>

		<div th:unless="${inventoryItem}">Non esiste</div>
	</body>

</html>

<!DOCTYPE html>
<html>
<head>
    <title>Profilo - SIW TV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <meta charset="UTF-8">
</head>

<body>
    <div class="container-fluid px-0" th:replace="fragments/header :: siteHeader"></div>

    <!-- Profile Hero Section -->
    <section class="profile-hero py-5" style="background: linear-gradient(135deg, var(--primary-color), var(--accent-color));">
        <div class="container">
            <div class="row justify-content-center" th:if="${user}">
                <div class="col-md-8 text-center text-white">
                    <div class="profile-avatar mb-3">
                        <i class="fas fa-user-circle fa-5x opacity-75"></i>
                    </div>
                    <h1 class="display-4 fw-bold mb-2" th:text="'Benvenuto ' + ${user.name}"></h1>
                    <p class="lead mb-4">Gestisci i tuoi ordini e richieste di ritiro</p>
                    <a th:href="@{/inventoryItems}" class="btn btn-primary btn-lg">
                        <i class="fas fa-plus me-2"></i>FAI UN NUOVO ORDINE
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <div class="container my-5" th:if="${user}">
        <div class="row g-4">
            <!-- Orders Section -->
            <div class="col-lg-6">
                <div class="card profile-card h-100">
                    <div class="card-header bg-transparent border-bottom-0 pb-0">
                        <h2 class="card-title text-primary">
                            <i class="fas fa-shopping-cart me-2"></i>I TUOI ORDINI
                        </h2>
                    </div>
                    <div class="card-body">
                        <div th:if="${userOrders==null || userOrders.isEmpty()}" class="text-center py-4">
                            <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                            <p class="text-muted mb-0">Non ci sono ordini nel sistema</p>
                        </div>
                        <div th:if="${userOrders!=null && !userOrders.isEmpty()}">
                            <div class="order-item" th:each="userOrder : ${userOrders}">
                                <a th:href="@{'/order' + '/' + ${userOrder.id}}" 
                                   class="text-decoration-none d-flex align-items-center justify-content-between p-3 border rounded mb-2 order-link">
                                    <div>
                                        <i class="fas fa-calendar me-2 text-primary"></i>
                                        <span th:text="${order.orderDate}"></span>
                                    </div>
                                    <div class="d-flex align-items-center">
                                        <span class="badge badge-condition me-2" th:text="${order.total}"></span>
                                        <i class="fas fa-chevron-right text-muted"></i>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pickup Requests Section -->
            <div class="col-lg-6">
                <div class="card profile-card h-100">
                    <div class="card-header bg-transparent border-bottom-0 pb-0">
                        <h2 class="card-title text-primary">
                            <i class="fas fa-truck me-2"></i>RICHIESTE DI RITIRO
                        </h2>
                    </div>
                    <div class="card-body">
                        <div th:if="${userRequests==null || userRequests.isEmpty()}" class="text-center py-4">
                            <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                            <p class="text-muted mb-0">Non ci sono richieste nel sistema</p>
                        </div>
                        <div th:if="${userRequests!=null && !userRequests.isEmpty()}">
                            <div class="request-item" th:each="userRequest : ${userRequests}">
                                <a th:href="@{'/request' + '/' + ${userRequest.id}}" 
                                   class="text-decoration-none d-flex align-items-center justify-content-between p-3 border rounded mb-2 request-link">
                                    <div>
                                        <i class="fas fa-calendar me-2 text-primary"></i>
                                        <span th:text="${userRequest.requestDate}"></span>
                                    </div>
                                    <div class="d-flex align-items-center">
                                        <span class="badge badge-status me-2" th:text="${userRequest.status}"></span>
                                        <i class="fas fa-chevron-right text-muted"></i>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/footer :: siteFooter}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

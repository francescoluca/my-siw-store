<!DOCTYPE html>
<html>

	<head>
		<title>Pagina profilo</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
			integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
		<link rel="stylesheet" href="/css/styles.css">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
		<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
		<meta charset="UTF-8">
	</head>

	<body>
		<div class="container-fluid px-0" th:replace="fragments/header :: siteHeader">
		</div>

		<div class="container" th:if="${user}">
			<h1 th:text="'Benvenuto ' + ${user.name} + ' ' + ${user.surname}"></h1>
			<p>Qui puoi visualizzare i tuoi ordini</p>
			<!-- eventuali form o pulsanti -->
			<a th:href="@{'/formNewOrder'}">FAI UN NUOVO ORDINE</a>
			<script src="…bootstrap.bundle.min.js"></script>
			<h1>ORDINI</h1>
			<div th:if="${userOrders==null || userOrders.isEmpty()}">Non ci sono ordini nel sistema</div>
			<ul>
				<li th:each="userOrder : ${userOrders}">
					<a th:href="@{'/order' + '/' + ${userOrder.id}}"
						th:text="${order.orderDate} + ' (' + ${order.total} + ')'"></a>
				</li>
			</ul>
			<h1>LE TUE RICHIESTE DI RITIRO</h1>
			<div th:if="${userRequests==null || userRequests.isEmpty()}">Non ci sono richieste nel sistema</div>
			<ul>
				<li th:each="userRequest : ${userRequests}">
					<a th:href="@{'/request' + '/' + ${userRequest.id}}"
						th:text="${userRequest.requestDate} + '(' + ${userRequest.status} + ')'"></a>
				</li>
			</ul>
		</div>
		<footer th:replace="~{fragments/footer :: siteFooter}"></footer>

	</body>

</html>

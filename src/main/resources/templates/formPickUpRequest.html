<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

	<head>
		<meta charset="UTF-8">
		<title>PickUpRequest</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
			integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
		<link rel="stylesheet" href="/css/styles.css">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
		<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
	</head>

	<body>
		<div class="container-fluid px-0" th:replace="fragments/header :: siteHeader">
		</div>
		<div class="container">
			<h1>RICHIEDI SERVIZIO DI RITIRO</h1>
			<p>Compila questo modulo</p>
			<form th:action="@{/newRequest}" method="POST" th:object="${pickUpRequest}" enctype="multipart/form-data">
				<div class="form-floating mb-3">
					<input type="text" required th:field="*{name}" class="form-control" placeholder="Inserisci nome" />
					<label for="name">Nome</label>

				</div>
				<div class="form-floating mb-3">
					<input type="text" required th:field="*{surname}" class="form-control"
						placeholder="Inserisci cognome" />
					<label for="surname">Cognome</label>

				</div>
				<div class="form-floating mb-3">
					<input type="text" required th:field="*{address}" class="form-control"
						placeholder="Inserisci indirizzo" />
					<label for="address">Indirizzo</label>

				</div>
				<div class="form-floating mb-3">
					<input th:field="*{phone}" class="form-control" placeholder="Telefono" required pattern="\d{10}" />
					<label for="phone">Numero di telefono</label>
				</div>

				<div class="form-floating mb-3">

					<input type="text" required th:field="*{email}" class="form-control"
						placeholder="Inserisci email" />
					<label for="surname">Email</label>

				</div>
				<div class="form-floating mb-3">
					<input type="date" required th:field="*{requestDate}" class="form-control"
						placeholder="Data di ritiro" />
					<label for="requestDate">Data preferenza ritiro</label>
				</div>
				<div class="mb-3">
					<label for="photo" class="form-label">Foto televisore</label>
					<input type="file" id="photo" name="photo" accept="image/*" class="form-control" />
				</div>

				<div class="form-floating mb-3">
					<input type="text" th:field="*{note}" class="form-control" placeholder="Inserisci delle note" />
					<label for="note" class="form-label">Inserisci ulteriori informazioni (facoltativo)</label>
				</div>
				<button type="submit" class="btn btn-primary">Salva</button>
			</form>
		</div>
	</body>
</html>

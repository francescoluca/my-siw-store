<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

	<head>
		<title>PickUpRequest</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
			integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
	</head>

	<body>
		<div class="container">
			<header th:replace="~{fragments/header :: siteHeader}"></header>

		</div>
		<div class="container">
			<h1>Benvenuto nel Servizio Ritiro</h1>
			<p>Qui puoi richiedere il ritiro del tuo dispositivo.</p>
			<!-- eventuali form o pulsanti -->
			<!-- <a th:href="@{'/formNewOrder'}">FAI UN NUOVO ORDINE</a> -->
			<script src="…bootstrap.bundle.min.js"></script>
			<h1>RITIRI</h1>
			<div th:if="${userRequests==null || userRequests.isEmpty()}">Non ci sono richieste nel sistema</div>
			<ul>
				<li th:each="userRequest : ${userRequests}">
					<a th:href="@{'/request' + '/' + ${userRequest.id}}"
						th:text="${userRequest.requestDate} + '(' + ${userRequest.status} + ')'"></a>
				</li>
			</ul>
		</div>
		<!-- header/nav come in homepage, oppure solo il contenuto specifico -->
		<div class="container">
			<h1>RICHIEDI UN NUOVO RITIRO</h1>
			<p>Compila questo modulo</p>
			<form th:action="@{/newRequest}" method="POST" th:object="${request}">


				<div class="form-floating mb-3">
					<input type="date" required th:field="*{requestDate}" class="form-control"
						placeholder="Data di nascita" />
					<label for="dayOfBirth">Data di nascita</label>
				</div>

				<!--     <div class="mb-3">
						                <label for="photo" class="form-label">Foto autore:</label>
						                <input type="file" id="photoFile" name="photoFile" accept="image/*" class="form-control" />
						                <div class="text-danger" th:if="${#fields.hasErrors('photo')}" th:errors="*{photo}"></div>
						            </div> -->
				<button type="submit" class="btn btn-primary">Salva</button>
			</form>

		</div>


	</body>

</html>

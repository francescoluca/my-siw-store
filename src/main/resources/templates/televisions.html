<!DOCTYPE html>
<html>

	<head>
		<title>TV</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
			integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
	</head>

	<body>
		<div class="container">
			<header th:replace="~{fragments/header :: siteHeader}"></header>

			<h1>TV</h1>
			<div th:if="${televisions==null || televisions.isEmpty()}">Non ci sono TV nel sistema</div>
			<ul>
				<li th:each="television : ${televisions}">
					<a th:href="@{'/television' + '/' + ${television.id}}"
						th:text="${television.model} + ' (' + ${television.brand} + ')'">Up! (2000)</a>
				</li>
			</ul>
		</div>
	</body>

</html>

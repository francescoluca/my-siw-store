<!DOCTYPE html>
<html>

	<head>
		<title>Catalogo televisori - SIW TV</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
			integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
		<link rel="stylesheet" href="/css/styles.css">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
		<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

		<meta charset="UTF-8">
	</head>

	<body>
		<div class="container-fluid px-0" th:replace="fragments/header :: siteHeader">
		</div>
		<div class="container">
			<h1>TV</h1>
			<div class="row mb-4">
				<div class="col-12">
					<div class="card shadow-sm">
						<div class="card-body">
							<form class="row g-3 align-items-center" method="get" th:action="@{/televisions}">
								<div class="col-md-10">
									<div class="input-group">
										<span class="input-group-text">
											<i class="bi bi-search"></i>
										</span>
										<input type="text" name="keyword" class="form-control form-control-lg"
											placeholder="Cerca modello di televisore" th:value="${keyword}" />
									</div>
								</div>
								<div class="col-md-2">
									<button type="submit" class="btn btn-primary btn-lg w-100">
										<i class="bi bi-search me-1"></i>Cerca
									</button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>

			<div class="row mb-4">
				<div class="col-12">
					<div class="card shadow-sm">
						<div class="card-body py-3">
							<div class="row align-items-center">
								<div class="col-md-6">
									<h5 class="mb-0">
										<i class="fas fa-list me-2 text-muted"></i>
										<span class="fw-normal"><b
												th:text="${televisionsCount}+' modelli di televisori nel database'"></b></span>
									</h5>
								</div>
								<div class="col-md-6">
									<form th:action="@{/televisions}" method="get" class="d-flex justify-content-end">
										<div class="input-group" style="width: 250px;">
											<label class="input-group-text" for="sort_select">
												<i class="fas fa-sort me-1"></i>Ordina per
											</label>
											<select id="sort_select" name="sortField" class="form-select"
												th:value="${sortField}" onchange="this.form.submit()"
												aria-label="Ordina i risultati">

												<option value="screenInches" th:selected="${sortField=='screenInches'}">
													Pollici
												</option>
												<option value="releaseDate" th:selected="${sortField=='releaseDate'}">
													Anno
												</option>
											</select>
											<input type="hidden" name="keyword" th:value="${keyword}" />
											<input type="hidden" name="sortDir" th:value="${sortDir}" />
										</div>
										<button type="button" class="btn btn-outline-secondary ms-2" th:onclick="'window.location.href=\'' 
													            + @{/televisions(keyword=${keyword},sortField=${sortField}, sortDir=${reverseSortDir})} 
													            + '\';'">
											<i class="bi"
												th:classappend="${sortDir=='asc'} ? ' bi-caret-up-fill' : ' bi-caret-down-fill'"></i>
										</button>
									</form>

								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div th:if="${televisions==null || televisions.isEmpty()}">Non ci sono TV nel sistema</div>
			<ul>
				<li th:each="television : ${televisions}">
					<a th:href="@{'/television' + '/' + ${television.id}}"
						th:text="${television.model} + ' (' + ${television.brand} + ')'">Up! (2000)</a>
				</li>
			</ul>
		</div>
		<nav aria-label="Paginazione risultati" class="mt-4">
			<ul class="pagination justify-content-center">
				<div th:if="${currentPage > 0}">
					<li class="page-item">
						<a class="page-link"
							th:href="@{/televisions(keyword=${keyword}, page=${currentPage - 1}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}">Precedente</a>
					</li>
				</div>
				<div th:if="${currentPage==0}">
					<li class="page-item disabled">
						<span class="page-link">Precedente</span>
					</li>
				</div>
				<li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
					<a class="page-link"
						th:href="@{/televisions(keyword=${keyword},page=${i}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}"
						th:text="${i + 1}" th:classappend="${i == currentPage} ? 'active' : ''"></a>
				</li>
				<div th:if="${currentPage < totalPages - 1}">
					<li class="page-item">
						<a class="page-link"
							th:href="@{/televisions(keyword=${keyword},page=${currentPage + 1}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}">Successivo</a>
					</li>
				</div>
				<div th:if="${currentPage == totalPages -1}">
					<li class="page-item disabled">
						<span class="page-link">Successivo</span>
					</li>
				</div>
			</ul>
		</nav>
		<footer th:replace="~{fragments/footer :: siteFooter}"></footer>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
			crossorigin="anonymous"></script>
	</body>

</html>

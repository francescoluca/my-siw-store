<!DOCTYPE html>
<html>

	<head>
		<title>
			Store
		</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
			integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
		<link rel="stylesheet" href="/css/styles.css">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
		<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
	</head>

	<body>
		<form class="position-absolute top-50 start-50 translate-middle" th:action="@{/register}" method="POST">
			<h1>Registrazione</h1>
			<div class="mb-3">
				<label for="name" class="form-label">Nome</label>
				<input name="name" type="text" class="form-control" required th:field="${user.name}">
				<div class="form-text">
					<span th:if="${#fields.hasErrors('user.name')}" th:errors="${user.name}"
						th:style="'color:red'"></span>
				</div>
			</div>
			<div class="mb-3">
				<label for="surname" class="form-label">Cognome</label>
				<input name="surname" type="text" class="form-control" required th:field="${user.surname}">
				<div class="form-text">
					<span th:if="${#fields.hasErrors('user.surname')}" th:errors="${user.surname}"
						th:style="'color:red'"></span>
				</div>
			</div>
			<div class="mb-3">
				<label for="email" class="form-label">Email</label>
				<input name="email" type="text" class="form-control" required th:field="${user.email}">
				<div class="form-text">
					<span th:if="${#fields.hasErrors('user.email')}" th:errors="${user.email}"
						th:style="'color:red'"></span>
				</div>
			</div>
			<div class="mb-3">
				<label for="username" class="form-label">Username</label>
				<input name="username" type="text" class="form-control" required th:field="${credentials.username}">
				<div class="form-text">
					<span th:if="${#fields.hasErrors('credentials.username')}" th:errors="${credentials.username}"
						th:style="'color:red'"></span>
				</div>
			</div>
			<div class="mb-3">
				<label for="password" class="form-label">Password</label>
				<input name="password" type="password" class="form-control" required th:field="${credentials.password}">
				<div class="form-text">
					<span th:if="${#fields.hasErrors('credentials.password')}" th:errors="${credentials.password}"
						th:style="'color:red'"></span>
				</div>
			</div>
			<button type="submit" class="btn btn-primary">Registrati</button>
			<span style="display: inline-block; width: 20px;"></span>

			<a th:href="@{/login}" th:text="Accedi">Hai già un account? Accedi</a>

			<div>
				<span th:if="${param.error != null}">Errore durante la registrazione</span>
			</div>

		</form>
	</body>

</html>

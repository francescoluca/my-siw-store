<!DOCTYPE html>
<html>

	<head>
		<title> - SIW TV</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
			integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
		<link rel="stylesheet" href="/css/styles.css">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

		<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

		<meta charset="UTF-8">
	</head>

	<body>
		<div class="container-fluid px-0" th:replace="fragments/header :: siteHeader"></div>
		<section class="py-5">
			<div class="container">
				<div class="request-card">
					<div class="request-card-header">
						<div class="request-id">
							<i class="fas fa-hashtag me-2"></i>
							<span th:text="'Richiesta ID: ' + ${request.id}">Richiesta ID: 001</span>
						</div>
						<div class="request-date">
							<i class="fas fa-calendar-alt me-2"></i>
							<span th:text="${#temporals.format(request.requestDate, 'dd/MM/yyyy')}"></span>
						</div>
					</div>

					<div class="request-card-body">
						<div class="row">
							<div class="col-md-8">
								<div class="customer-info mb-3">
									<h4 class="customer-name">
										<i class="fas fa-user-circle me-2"></i>
										<span th:text="${request.name + ' ' + request.surname}">Mario
											Rossi</span>
									</h4>
									<div class="customer-details">
										<div class="detail-item">
											<i class="fas fa-envelope me-2"></i>
											<span th:text="${request.email}">mario.rossi@email.com</span>
										</div>
										<div class="detail-item">
											<i class="fas fa-phone me-2"></i>
											<span th:text="${request.phone}">+39 123 456 7890</span>
										</div>
										<div class="detail-item">
											<i class="fas fa-map-marker-alt me-2"></i>
											<span th:text="${request.address}">Via Roma 123, Roma</span>
										</div>
									</div>
								</div>

								<div th:if="${request.note != null and !request.note.empty}" class="request-notes">
									<h5 class="notes-title">
										<i class="fas fa-comment-alt me-2"></i>Note del Cliente:
									</h5>
									<p class="notes-content" th:text="${request.note}">Note del cliente</p>
								</div>
							</div>
							<div class="col-md-4">
								<div class="request-photo mb-3">
									<h5 class="photo-title">
										<i class="fas fa-image me-2"></i>Foto Allegata:
									</h5>
									<div class="ratio ratio-16x9">
										<img th:src="${request.photo != null} ? @{/pickUpRequest/{id}/photo(id=${request.id})} : @{/images/noTelevisionPhoto.jpg}"
											alt="Foto televisore" class="img-fluid rounded border object-fit-contain" />
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
		<section class="py-5">
			<div class="container">
				<form th:action="@{'/admin/completePickUpRequest' + '/' + ${request.id}}" method="post" enctype="multipart/form-data"
					th:object="${pickUpRequestItem}">
					<div class="form-floating mb-3">
						<input type="text" required th:field="*{productCode}" class="form-control"
							placeholder="Codice prodotto" />
						<label for="productCode">Codice prodotto</label>
					</div>
					<div class="form-floating mb-3">
						<select class="form-select" th:field="*{television}" id="television">
							<option value="" th:text="'Nessuna selezione'"></option>
							<option th:each="television : ${televisions}" th:value="${television.id}"
								th:text="${television.model}">
							</option>
						</select>

						<label for="model">Modello</label>
					</div>
					<div class="form-floating mb-3">
						<select class="form-select" required th:field="*{condition}" id="condition">
							<option value="" th:text="'Nessuna selezione'"></option>
							<option th:each="condition : ${T(it.uniroma3.siw.model.Util.Condition).values()}"
								th:value="${condition}" th:text="${condition.label}">
							</option>
						</select>

						<label for="condition">Condizione</label>
					</div>
					<div class="form-floating mb-3">
						<input type="numeber" required th:field="*{price}" class="form-control" placeholder="Prezzo" />
						<label for="price">Prezzo</label>
					</div>
					<div class="mb-3">
						<div class="position-relative d-inline-block" style="--bs-aspect-ratio: 150%; max-width:200px">
							<img th:if="${request.photo}" th:src="@{'/pickUpRequest/' + ${request.id} + '/photo'}"
								class="w-100 h-100 object-fit-contain" alt="Foto televisore" />
							<img th:unless="${request.photo}" src="/images/noTelevisionPhoto.jpg"
								class="w-100 h-100 object-fit-contain" alt="Foto assente" />
							<div class="position-absolute" style="top: 5px; right: 5px; opacity: 0.8;">
								<button type="button" id="btnChangeCover" class="btn btn-light btn-sm me-1">
									<i class="bi bi-pencil-fill"></i>
								</button>
								<button type="button" id="btnDeleteCover" class="btn btn-light btn-sm">
									<i class="bi bi-trash-fill text-danger"></i>
								</button>
							</div>
							<input type="file" id="photoInput" name="photo" accept="image/*" style="display: none;" />
						</div>
					</div>
					<div class="form-floating mb-3">
						<input type="text" th:field="*{description}" class="form-control" placeholder="Descrizione" />
						<label for="description">Descrizione (facoltativo)</label>
					</div>
					<button type="submit" class="btn btn-primary">Salva</button>
				</form>
			</div>
		</section>
		<footer th:replace="~{fragments/footer :: siteFooter}"></footer>

		<script>
			document.getElementById('btnChangeCover')
				.addEventListener('click', () => {
					document.getElementById('photoInput').click();
				});

			document.getElementById('btnDeleteCover')
				.addEventListener('click', () => {
					img.src = '/images/noTelevisionPhoto.jpg';
					input.value = ''; // Pulisce l'input file
				});


			const input = document.getElementById('photoInput');
			const img = document.querySelector('.position-relative img');

			input.addEventListener('change', () => {
				if (!input.files || !input.files[0]) return;
				const reader = new FileReader();
				reader.onload = e => img.src = e.target.result;
				reader.readAsDataURL(input.files[0]);
			});
		</script>

	</body>

</html>

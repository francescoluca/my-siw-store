<!DOCTYPE html>
<html>

	<head>
		<title>
			Modifica televisore
		</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
			integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
		<!-- Bootstrap CSS -->
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
			integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

		<!-- Bootstrap Icons -->
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

		<!-- Google Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link
			href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
			rel="stylesheet">
			<link rel="stylesheet" href="/css/styles.css">
			<meta charset="UTF-8">
			</head>

	<body>
		<div class="container">
			<div th:replace="fragments/header :: siteHeader"></div>			<h1>Aggiorna televisore</h1>
			<form th:action="@{'/admin/updateTelevision/' + ${television.id}}" th:object="${television}" method="post"
				enctype="multipart/form-data">
				<div class="form-floating mb-3">
					<input type="text" required th:field="*{model}" class="form-control"
						placeholder="Modello televisore" />
					<label for="model">Modello</label>
				</div>
				<div class="form-floating mb-3">
					<select class="form-select" th:field="*{brand}" id="brand">
						<option th:value="${null}" th:text="'Nessuna selezione'"></option>
						<option th:each="brand : ${T(it.uniroma3.siw.model.Util.Brand).values()}" th:value="${brand}"
							th:text="${brand}">Brand</option>
					</select>
					<label for="brand">Marca</label>
				</div>
				<div class="form-floating mb-3">
					<input type="text" required th:field="*{releaseDate}" class="form-control"
						placeholder="Anno di uscita" />
					<label for="releaseDate">Anno di uscita</label>
				</div>
				<div class="form-floating mb-3">
					<input type="text" required th:field="*{screenInches}" class="form-control" placeholder="Pollici" />
					<label for="screenInches">Pollici</label>
				</div>
				<div class="form-floating mb-3">
					<input type="text" required th:field="*{code}" class="form-control"
						placeholder="Codice identificativo" />
					<label for="code">Codice identificativo</label>
				</div>
				<div class="form-floating mb-3">
					<input type="text" th:field="*{description}" class="form-control" placeholder="Descrizione" />
					<label for="description">Descrizione (facoltativo)</label>
				</div>
				<div class="mb-3">
					<div class="position-relative d-inline-block" style="--bs-aspect-ratio: 150%; max-width:200px">
						<img th:if="${television.photo}" th:src="@{'/television/' + ${television.id} + '/photo'}"
							class="w-100 h-100 object-fit-contain" alt="Foto televisore" />
						<img th:unless="${television.photo}" src="/images/noTelevisionPhoto.jpg"
							class="w-100 h-100 object-fit-contain" alt="Foto assente" />
						<div class="position-absolute" style="top: 5px; right: 5px; opacity: 0.8;">
							<button type="button" id="btnChangeCover" class="btn btn-light btn-sm me-1">
								<i class="bi bi-pencil-fill"></i>
							</button>
							<button type="button" id="btnDeleteCover" class="btn btn-light btn-sm">
								<i class="bi bi-trash-fill text-danger"></i>
							</button>
						</div>
						<input type="file" id="photoInput" name="photo" accept="image/*" style="display: none;" />
					</div>
				</div>
				<button type="submit" class="btn btn-primary">Salva</button>
			</form>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-..." crossorigin="anonymous"></script>

		<script>
			document.getElementById('btnChangeCover')
				.addEventListener('click', () => {
					document.getElementById('photoInput').click();
				});

			document.getElementById('btnDeleteCover')
				.addEventListener('click', () => {
					img.src = '/images/noTelevisionPhoto.jpg';
					input.value = ''; // Pulisce l'input file
				});


			const input = document.getElementById('photoInput');
			const img = document.querySelector('.position-relative img');

			input.addEventListener('change', () => {
				if (!input.files || !input.files[0]) return;
				const reader = new FileReader();
				reader.onload = e => img.src = e.target.result;
				reader.readAsDataURL(input.files[0]);
			});
		</script>

</html>

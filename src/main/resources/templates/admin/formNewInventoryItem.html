<!DOCTYPE html>
<html>

	<head>
		<title>
			Nuovo televisore in magazzino - SIW TV
		</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
			integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
		<link rel="stylesheet" href="/css/styles.css">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
		<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
		<meta charset="UTF-8">
	</head>

	<body>
		<div class="container-fluid px-0" th:replace="fragments/header :: siteHeader"></div>
		<div class="container">
			<h1>Aggiungi un televisore in magazzino</h1>
			<form th:action="@{/admin/inventoryItem}" method="post" enctype="multipart/form-data"
				th:object="${inventoryItem}">
				<input type="hidden" th:field="*{id}" />
				<div class="form-floating mb-3">
					<input type="text" required th:field="*{productCode}" class="form-control"
						placeholder="Codice prodotto" />
					<label for="productCode">Codice prodotto</label>
				</div>
				<div class="form-floating mb-3">
					<select class="form-select" th:field="*{television}" id="television">
						<option value="" th:text="'Nessuna selezione'"></option>
						<option th:each="television : ${televisions}" th:value="${television.id}"
							th:text="${television.model}">
						</option>
					</select>

					<label for="model">Modello</label>
				</div>
				<div class="form-floating mb-3">
					<select class="form-select" th:field="*{condition}" id="condition">
						<option value="" th:text="'Nessuna selezione'"></option>
						<option th:each="condition : ${T(it.uniroma3.siw.model.Util.Condition).values()}"
							th:value="${condition}" th:text="${condition.label}">
						</option>
					</select>

					<label for="condition">Condizione</label>
				</div>
				<div class="form-floating mb-3">
					<label for="price">Prezzo</label>
					<input type="number" th:field="*{price}" class="form-control" />
				</div>
				<div class="mb-3">
					<label for="photo" class="form-label">Foto televisore:</label>
					<input type="file" id="photo" name="photo" accept="image/*" class="form-control" />
					<div class="text-danger" th:if="${#fields.hasErrors('photo')}" th:errors="*{photo}"></div>
				</div>
				<div class="form-floating mb-3">
					<input type="text" th:field="*{description}" class="form-control" placeholder="Descrizione" />
					<label for="description">Descrizione (facoltativo)</label>
				</div>
				<button type="submit" class="btn btn-primary">Salva</button>
			</form>
		</div>
		<footer th:replace="~{fragments/footer :: siteFooter}"></footer>
	</body>

</html>

<!DOCTYPE html>
<html>

	<head>
		<title>Televisori</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
			integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
		<link rel="stylesheet" href="/css/styles.css">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
		<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
		<meta charset="UTF-8">
	</head>

	<body>
		<div class="container-fluid px-0" th:replace="fragments/header :: siteHeader">
		</div>
		<div class="container">
			<h1>Televisori</h1>
			<div th:if="${inventoryItems.isEmpty()}">Non ci sono televisori nel sistema</div>
			<ul>
				<li th:each="inventoryItem : ${inventoryItems}">
					<span
						th:text="${inventoryItem.productCode} + ' '+ ${inventoryItem.television.model} +' (' + ${inventoryItem.television.brand} + ')'"></span>
					<a th:href="@{'/admin/formUpdateInventoryItem' + '/' + ${inventoryItem.id}}">Aggiorna</a>
				</li>
			</ul>
		</div>
	</body>

</html>

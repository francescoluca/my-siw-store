<!DOCTYPE html>
<html>

	<head>
		<title>Televisori</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
			integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
			<link rel="stylesheet" href="/css/styles.css">
			<meta charset="UTF-8">
	</head>

	<body>
		<div class="container">
			<div th:replace="fragments/header :: siteHeader"></div>
			<h1>Televisori</h1>
			<div th:if="${televisions.isEmpty()}">Non ci sono televisori nel sistema</div>
			<ul>
				<li th:each="television : ${televisions}">
					<span th:text="${television.model} + ' (' + ${television.brand} + ')'">Up! (2000)</span>
					<a th:href="@{'/admin/formUpdateTelvision' + '/' + ${television.id}}">Aggiorna</a>
				</li>
			</ul>
		</div>
	</body>

</html>

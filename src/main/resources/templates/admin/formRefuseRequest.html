<!DOCTYPE html>
<html>

	<head>
		<title> - SIW TV</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
			integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
		<link rel="stylesheet" href="/css/styles.css">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
		<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
		<meta charset="UTF-8">
	</head>

	<body>
		<div class="container-fluid px-0" th:replace="fragments/header :: siteHeader"></div>
		<section class="py-5">
			<div class="container">
				<div class="request-card">
					<div class="request-card-header">
						<div class="request-id">
							<i class="fas fa-hashtag me-2"></i>
							<span th:text="'Richiesta ID: ' + ${request.id}">Richiesta ID: 001</span>
						</div>
						<div class="request-date">
							<i class="fas fa-calendar-alt me-2"></i>
							<span th:text="${#temporals.format(request.requestDate, 'dd/MM/yyyy')}"></span>
						</div>
					</div>

					<div class="request-card-body">
						<div class="row">
							<div class="col-md-8">
								<div class="customer-info mb-3">
									<h4 class="customer-name">
										<i class="fas fa-user-circle me-2"></i>
										<span th:text="${request.name + ' ' + request.surname}">Mario
											Rossi</span>
									</h4>
									<div class="customer-details">
										<div class="detail-item">
											<i class="fas fa-envelope me-2"></i>
											<span th:text="${request.email}">mario.rossi@email.com</span>
										</div>
										<div class="detail-item">
											<i class="fas fa-phone me-2"></i>
											<span th:text="${request.phone}">+39 123 456 7890</span>
										</div>
										<div class="detail-item">
											<i class="fas fa-map-marker-alt me-2"></i>
											<span th:text="${request.address}">Via Roma 123, Roma</span>
										</div>
									</div>
								</div>

								<div th:if="${request.note != null and !request.note.empty}" class="request-notes">
									<h5 class="notes-title">
										<i class="fas fa-comment-alt me-2"></i>Note del Cliente:
									</h5>
									<p class="notes-content" th:text="${request.note}">Note del cliente</p>
								</div>
							</div>
							<div class="col-md-4">
								<div class="request-photo mb-3">
									<h5 class="photo-title">
										<i class="fas fa-image me-2"></i>Foto Allegata:
									</h5>
									<div class="ratio ratio-16x9">
										<img th:src="${request.photo != null} ? @{/pickUpRequest/{id}/photo(id=${request.id})} : @{/images/noTelevisionPhoto.jpg}"
											alt="Foto televisore" class="img-fluid rounded border object-fit-contain" />
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<section class="py-5">
				<div class="container">
					<form th:action="@{'/admin/refusePickUpRequest/' + ${request.id}}" th:object="${request}"
						method="post" enctype="multipart/form-data">
						<input type="hidden" th:field="*{id}" />
						<div class="form-floating mb-3">
							<textarea required th:field="*{adminNote}" class="form-control" placeholder="Spiegazione del rifiuto della richiesta (visualizzabile dal
															cliente)" style="height: 100px" maxlength="2000"></textarea>
							<label for="adminNote">Spiegazione del rifiuto della richiesta (visualizzabile dal
								cliente)</label>
						</div>
						<button type="submit" class="btn btn-primary">Salva</button>
					</form>
				</div>
			</section>
			<footer th:replace="~{fragments/footer :: siteFooter}"></footer>
	</body>

</html>

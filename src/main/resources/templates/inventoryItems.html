<!DOCTYPE html>
<html>

	<head>
		<title>TV</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
			integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
		<link rel="stylesheet" href="/css/styles.css">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
		<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
		<meta charset="UTF-8">
	</head>

	<body>
		<div class="container-fluid px-0" th:replace="fragments/header :: siteHeader">
		</div>
		<div class="container">
			<h1>TV</h1>
			<div th:if="${inventoryItems==null || inventoryItems.isEmpty()}">Non ci sono TV in magazzino</div>
			<ul>
				<li th:each="inventoryItem : ${inventoryItems}">
					<a th:href="@{'/inventoryItem' + '/' + ${inventoryItem.id}}"
						th:text="${inventoryItem.productCode} +' '+${inventoryItem.television.model} + ' (' + ${inventoryItem.television.brand} + ')'">Up!
						(2000)</a>
				</li>
			</ul>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
			crossorigin="anonymous"></script>
	</body>

</html>
